<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひのぼうけん</title>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.179.1/build/three.module.js"
        }
    }
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="creatorCard">
        <div class="creatorYear">2026年 わく夏</div>
        <div class="creatorName">伊藤ゼミ作成</div>
    </div>

    <div id="info">
        <div class="infoItem">
            <span class="infoLabel">のこり</span>
            <div class="infoValue">
                <span id="time">15</span>
                <span class="infoUnit">びょう</span>
            </div>
        </div>

        <div class="infoDivider"></div>

        <div class="infoItem">
            <span class="infoLabel">れんだ</span>
            <div class="infoValue">
                <span id="count">0</span>
                <span class="infoUnit">かい</span>
            </div>
        </div>
    </div>

    <div id="remaining">
        クリアまで あと
        <span id="remainingCount">0</span>
        かい
    </div>

    <div id="message"></div>

    <!-- 子どもにはタイトル画面、運営は数字キーで難易度を設定 -->
    <div id="levelSelect" class="openingScreen">
        <div class="openingShade"></div>
        <div id="openingGlow" class="openingGlow"></div>
        <div id="openingEmbers" class="openingEmbers" aria-hidden="true"></div>

        <div id="levelSelectPanel" class="openingPanel">
            <div class="openingFlame" aria-hidden="true">🔥</div>
            <h1 id="openingTitle" class="openingTitle">ひのぼうけん</h1>
            <p id="openingSubtitle" class="openingSubtitle">はじまるよ！</p>
            <div id="openingCountdown" class="openingCountdown" aria-live="polite"></div>
        </div>

        <div class="staffHint">運営：1・2・3キー</div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
